name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  web-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint src
        run: npx eslint src --format stylish

      - name: Run unit tests
        run: npm test

      - name: Run Firestore rules tests
        run: npm run test:firestore

      - name: Build web app
        run: npm run build

      - name: Check production dependency audit
        run: npm audit --omit=dev

      - name: Check bundle budgets
        run: npm run perf:check
